workflows:
  ios-medikto-testflight:
    name: Medikto iOS TestFlight
    working_directory: medikto-app
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: medikto-api

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.medikto

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ~/Library/Caches/org.swift.swiftpm
        - ~/Library/org.swift.swiftpm

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Resolve iOS dependencies
        script: |
          # Optimize git settings for large binary downloads
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          # Pre-cache iOS engine artifacts
          flutter precache --ios

          # Generate ephemeral build configs and CocoaPods
          flutter build ios --config-only --no-codesign

          # Retry Swift Package Manager resolution (handles transient network drops on large binaries like FirebaseFirestoreInternal)
          cd ios
          MAX_RETRIES=5
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES: Resolving Swift Package Manager dependencies..."
            if xcodebuild -resolvePackageDependencies -workspace Runner.xcworkspace -scheme Runner; then
              echo "Swift Package Manager dependencies resolved successfully."
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                echo "SPM resolution interrupted or timed out. Retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
              else
                echo "Failed to resolve SPM dependencies after $MAX_RETRIES attempts."
                exit 1
              fi
            fi
          done
          cd ..

      - name: Build signed IPA
        script: |
          # Fetch latest build number from TestFlight, or fallback safely to Codemagic $BUILD_NUMBER
          LATEST_BUILD_NUMBER=$(app-store-connect fetch-build-number com.example.medikto 2>/dev/null || echo 0)
          
          # Ensure LATEST_BUILD_NUMBER is numeric
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=0
          fi
          
          # Codemagic $BUILD_NUMBER increments on every build; add offset (+2) to always exceed previous uploads
          CM_BUILD_NUM=$((${BUILD_NUMBER:-1} + 2))
          
          if [ "$LATEST_BUILD_NUMBER" -gt 0 ]; then
            ASC_NEXT=$((LATEST_BUILD_NUMBER + 1))
            BUILD_NUM=$(( ASC_NEXT > CM_BUILD_NUM ? ASC_NEXT : CM_BUILD_NUM ))
          else
            BUILD_NUM=$CM_BUILD_NUM
          fi
          
          echo "=========================================="
          echo "Latest App Store Build Number : $LATEST_BUILD_NUMBER"
          echo "Codemagic Build Number        : $BUILD_NUMBER"
          echo "Final Build Number for .ipa   : $BUILD_NUM"
          echo "=========================================="
          
          flutter build ipa --release \
            --build-number=$BUILD_NUM \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true