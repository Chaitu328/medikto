workflows:
  ios-medikto:
    name: Medikto iOS Signed Ad Hoc IPA
    working_directory: medikto-app
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: medikto-api

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.example.medikto

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log