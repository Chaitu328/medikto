workflows:
  ios-medikto:
    name: Medikto iOS Signed Ad Hoc IPA
    working_directory: medikto-app
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: medikto-api

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.example.medikto

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log


  ios-medikto-testflight:
    name: Medikto iOS TestFlight
    working_directory: medikto-app
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: medikto-api

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.medikto

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          # Fetch latest build number from TestFlight, or fallback safely to Codemagic $BUILD_NUMBER
          LATEST_BUILD_NUMBER=$(app-store-connect fetch-build-number com.example.medikto 2>/dev/null || echo 0)
          
          # Ensure LATEST_BUILD_NUMBER is numeric
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=0
          fi
          
          # Codemagic $BUILD_NUMBER increments on every build; add offset (+10) to always exceed previous uploads
          CM_BUILD_NUM=$((${BUILD_NUMBER:-1} + 10))
          
          if [ "$LATEST_BUILD_NUMBER" -gt 0 ]; then
            ASC_NEXT=$((LATEST_BUILD_NUMBER + 1))
            BUILD_NUM=$(( ASC_NEXT > CM_BUILD_NUM ? ASC_NEXT : CM_BUILD_NUM ))
          else
            BUILD_NUM=$CM_BUILD_NUM
          fi
          
          echo "=========================================="
          echo "Latest App Store Build Number : $LATEST_BUILD_NUMBER"
          echo "Codemagic Build Number        : $BUILD_NUMBER"
          echo "Final Build Number for .ipa   : $BUILD_NUM"
          echo "=========================================="
          
          flutter build ipa --release \
            --build-number=$BUILD_NUM \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true