services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikto-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Kolkata
      - PORT=4000
      - DOCDB_CA_PATH=/app/certs/global-bundle.pem
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/certs/firebase-service-account.json
      - AWS_REGION=ap-south-1
      - S3_BUCKET_NAME=medikto-s3-bucket
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
