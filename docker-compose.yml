services:
  # ── Medikto Backend REST API ────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: medikto-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./Backend/.env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Kolkata
      - PORT=4000
      - DOCDB_CA_PATH=/app/certs/global-bundle.pem
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/certs/firebase-service-account.json
      - AWS_REGION=ap-south-1
      - S3_BUCKET_NAME=medikto-s3-bucket
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Medikto Admin & Super Admin Panel ───────────────────────────────────────
  admin-panel:
    build:
      context: ./Frontend/Admin-panel
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api-prd.medikto.com/api
    container_name: medikto-admin-panel
    restart: unless-stopped
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Medikto Landing Marketing Website ───────────────────────────────────────
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: medikto-website
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Kolkata
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=healthreportsapp7@gmail.com
      - SMTP_PASS=cqvxqlydhbgteeau
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
